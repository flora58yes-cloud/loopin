<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk & Daftar — LoopIn</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sage: {
              DEFAULT: '#7A8E78',
              hover: '#687A66',
              light: '#EBF0EA'
            },
            charcoal: {
              DEFAULT: '#232822',
              hover: '#191D18',
              muted: '#5C625A'
            },
            oatmeal: '#F7F5F0',
            taupe: '#E5E0D8',
            amber: {
              DEFAULT: '#D4A373',
              hover: '#C29161'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif']
          }
        }
      }
    }
  </script>

  <style>
    /* Toast Animation */
    .toast-slide {
      animation: slideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideDown {
      from { transform: translateY(-100%) translateX(-50%); opacity: 0; }
      to { transform: translateY(0) translateX(-50%); opacity: 1; }
    }
  </style>
</head>
<body class="bg-oatmeal text-charcoal font-sans min-h-screen flex flex-col justify-between antialiased selection:bg-sage selection:text-white">

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none w-full max-w-sm px-4"></div>

  <!-- HEADER UTAMA -->
  <header class="bg-sage text-white sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        
        <!-- Brand Group & Back Button Konsisten -->
        <div class="flex items-center gap-3">
          <a href="index.html#katalog" class="p-1.5 text-white hover:opacity-80 transition-opacity flex items-center justify-center" aria-label="Kembali ke Katalog">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
          </a>

          <a href="index.html" class="flex items-center gap-2 group">
            <img src="assets/images/branding/logo.png" alt="LoopIn Logo" class="h-8 w-auto brightness-0 invert">
            <span class="font-serif text-2xl font-bold tracking-tight block leading-none">LoopIn</span>
          </a>
        </div>

        <!-- Help Link -->
        <a href="#" class="text-xs sm:text-sm text-white/90 hover:text-white underline-offset-4 hover:underline transition-all">
          Bantuan & FAQ
        </a>

      </div>
    </div>
  </header>

  <!-- MAIN AUTH CONTAINER -->
  <main class="flex-1 flex items-center justify-center py-10 px-4 sm:px-6">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-taupe overflow-hidden my-auto transition-all">
      
      <!-- Card Top Header Banner -->
      <div class="bg-sage p-6 text-white text-center relative overflow-hidden">
        <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
        <h1 class="font-serif text-2xl sm:text-3xl font-bold tracking-wide">Selamat Datang</h1>
        <p class="text-xs sm:text-sm text-white/85 mt-1 font-light">Give it Another Loop with LoopIn</p>

        <!-- Tab Switcher -->
        <div class="flex bg-charcoal/20 p-1 rounded-xl mt-6 border border-white/15">
          <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all bg-white text-charcoal shadow-sm">
            Masuk
          </button>
          <button id="tab-register" onclick="switchTab('register')" class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-white/80 hover:text-white">
            Daftar Akun
          </button>
        </div>
      </div>

      <!-- Card Body Forms -->
      <div class="p-6 sm:p-8">
        
        <!-- ==================== FORM LOGIN ==================== -->
        <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label for="login-identifier" class="block text-xs font-semibold text-charcoal mb-1">Email atau No. Telepon</label>
            <input type="text" id="login-identifier" required placeholder="Masukkan Email atau No Telepon" 
                   class="w-full px-4 py-2.5 text-sm bg-oatmeal border border-taupe rounded-xl focus:outline-none focus:border-sage focus:ring-1 focus:ring-sage transition-all text-charcoal">
          </div>

          <div>
            <div class="flex items-center justify-between mb-1">
              <label for="login-password" class="text-xs font-semibold text-charcoal">Kata Sandi</label>
              <a href="#" onclick="forgotPassword(event)" class="text-[11px] text-sage hover:underline font-medium">Lupa kata sandi?</a>
            </div>
            <div class="relative">
              <input type="password" id="login-password" required placeholder="••••••••" 
                     class="w-full px-4 py-2.5 text-sm bg-oatmeal border border-taupe rounded-xl focus:outline-none focus:border-sage focus:ring-1 focus:ring-sage transition-all text-charcoal pr-10">
              <button type="button" onclick="togglePassword('login-password', 'eye-icon-login')" class="absolute right-3 top-2.5 text-charcoal-muted hover:text-charcoal" aria-label="Lihat kata sandi">
                <svg id="eye-icon-login" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              </button>
            </div>
          </div>

          <div class="flex items-center">
            <input type="checkbox" id="remember-me" class="rounded border-taupe text-sage focus:ring-sage cursor-pointer w-4 h-4">
            <label for="remember-me" class="ml-2 text-xs text-charcoal/80 cursor-pointer">Ingat saya di perangkat ini</label>
          </div>

          <button type="submit" class="w-full py-3 bg-charcoal hover:bg-charcoal-hover text-white text-sm font-semibold rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
            <span>Masuk ke LoopIn</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
          </button>

          <!-- Divider -->
          <div class="relative my-5">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-taupe"></div></div>
            <div class="relative flex justify-center text-[10px] uppercase"><span class="bg-white px-3 text-charcoal-muted font-medium tracking-wider">Atau masuk dengan</span></div>
          </div>

          <!-- Social Login Button -->
          <button type="button" onclick="socialLogin('Google')" class="w-full py-2.5 px-4 border border-taupe rounded-xl text-xs font-semibold text-charcoal hover:bg-oatmeal transition-all flex items-center justify-center gap-3">
            <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
            Lanjutkan dengan Google
          </button>
        </form>

        <!-- ==================== FORM REGISTER ==================== -->
        <form id="form-register" onsubmit="handleRegister(event)" class="space-y-3.5 hidden">
          <div>
            <label for="reg-name" class="block text-xs font-semibold text-charcoal mb-1">Nama Lengkap</label>
            <input type="text" id="reg-name" required placeholder="Nama" 
                   class="w-full px-4 py-2.5 text-sm bg-oatmeal border border-taupe rounded-xl focus:outline-none focus:border-sage focus:ring-1 focus:ring-sage transition-all text-charcoal">
          </div>

          <div>
            <label for="reg-email" class="block text-xs font-semibold text-charcoal mb-1">Alamat Email</label>
            <input type="email" id="reg-email" required placeholder="Email" 
                   class="w-full px-4 py-2.5 text-sm bg-oatmeal border border-taupe rounded-xl focus:outline-none focus:border-sage focus:ring-1 focus:ring-sage transition-all text-charcoal">
          </div>

          <div>
            <label for="reg-phone" class="block text-xs font-semibold text-charcoal mb-1">No. WhatsApp / Telepon</label>
            <input type="tel" id="reg-phone" required placeholder="+62" 
                   class="w-full px-4 py-2.5 text-sm bg-oatmeal border border-taupe rounded-xl focus:outline-none focus:border-sage focus:ring-1 focus:ring-sage transition-all text-charcoal">
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label for="reg-pass" class="block text-xs font-semibold text-charcoal mb-1">Kata Sandi</label>
              <div class="relative">
                <input type="password" id="reg-pass" required minlength="6" placeholder="Min. 6 Karakter" 
                       class="w-full px-3.5 py-2.5 text-sm bg-oatmeal border border-taupe rounded-xl focus:outline-none focus:border-sage focus:ring-1 focus:ring-sage transition-all text-charcoal pr-9">
                <button type="button" onclick="togglePassword('reg-pass', 'eye-icon-reg1')" class="absolute right-2.5 top-2.5 text-charcoal-muted hover:text-charcoal" aria-label="Lihat kata sandi">
                  <svg id="eye-icon-reg1" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                </button>
              </div>
            </div>

            <div>
              <label for="reg-confirm" class="block text-xs font-semibold text-charcoal mb-1">Konfirmasi Sandi</label>
              <div class="relative">
                <input type="password" id="reg-confirm" required minlength="6" placeholder="Ulangi Sandi" 
                       class="w-full px-3.5 py-2.5 text-sm bg-oatmeal border border-taupe rounded-xl focus:outline-none focus:border-sage focus:ring-1 focus:ring-sage transition-all text-charcoal pr-9">
                <button type="button" onclick="togglePassword('reg-confirm', 'eye-icon-reg2')" class="absolute right-2.5 top-2.5 text-charcoal-muted hover:text-charcoal" aria-label="Lihat konfirmasi kata sandi">
                  <svg id="eye-icon-reg2" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                </button>
              </div>
            </div>
          </div>

          <div class="flex items-start pt-1">
            <input type="checkbox" id="terms-check" required class="mt-0.5 rounded border-taupe text-sage focus:ring-sage cursor-pointer w-4 h-4 shrink-0">
            <label for="terms-check" class="ml-2 text-[11px] text-charcoal/80 leading-relaxed cursor-pointer">
              Saya menyetujui Kebijakan Sustainable Marketplace, <a href="#" class="text-sage font-medium hover:underline">Syarat & Ketentuan</a>, serta <a href="#" class="text-sage font-medium hover:underline">Kebijakan Privasi</a> LoopIn.
            </label>
          </div>

          <button type="submit" class="w-full py-3 bg-amber hover:bg-amber-hover text-white text-sm font-semibold rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
            <span>Buat Akun LoopIn</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
          </button>
        </form>

      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-charcoal text-white/70 py-6 border-t border-charcoal-muted/20">
    <div class="max-w-7xl mx-auto px-4 text-center text-xs space-y-2">
      <p>&copy; 2026 LoopIn Platform. Give it another loop.</p>
      <div class="flex justify-center gap-4 text-white/50 text-[11px]">
        <a href="#" class="hover:text-white transition-colors">Syarat Kebijakan</a>
        <span>•</span>
        <a href="#" class="hover:text-white transition-colors">Panduan Thrift & Sustainable</a>
        <span>•</span>
        <a href="#" class="hover:text-white transition-colors">Hubungi Kami</a>
      </div>
    </div>
  </footer>

  <!-- JAVASCRIPT CONTROLLERS -->
  <script>
    function switchTab(tab) {
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');

      if (tab === 'login') {
        tabLogin.className = "flex-1 py-2 text-xs font-semibold rounded-lg transition-all bg-white text-charcoal shadow-sm";
        tabRegister.className = "flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-white/80 hover:text-white";
        formLogin.classList.remove('hidden');
        formRegister.classList.add('hidden');
      } else {
        tabRegister.className = "flex-1 py-2 text-xs font-semibold rounded-lg transition-all bg-white text-charcoal shadow-sm";
        tabLogin.className = "flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-white/80 hover:text-white";
        formRegister.classList.remove('hidden');
        formLogin.classList.add('hidden');
      }
    }

    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);

      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.025 10.025 0 0112.122 12.122m-2.122 2.122L3 3l18 18"/>`;
      } else {
        input.type = 'password';
        icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>`;
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-pass').value;

      try {
        const apiUrl = (window.location.port === '5000' || window.location.origin.includes('localhost:5000'))
          ? '/api/auth/login'
          : 'http://localhost:5000/api/auth/login';

        const res = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password: pass })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('loopin_user', JSON.stringify(data.user));
        }
      } catch (err) {
        // Fallback mode offline
      }

      showToast('Selamat datang kembali! Mengalihkan ke katalog... 🛍️', 'success');
      setTimeout(() => {
        const redirectTo = new URLSearchParams(window.location.search).get('redirect') || 'tracking.html';
        window.location.href = redirectTo;
      }, 1200);
    }

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const pass = document.getElementById('reg-pass').value;
      const confirm = document.getElementById('reg-confirm').value;

      if (pass !== confirm) {
        showToast('Konfirmasi kata sandi tidak cocok!', 'error');
        return;
      }

      try {
        const apiUrl = (window.location.port === '5000' || window.location.origin.includes('localhost:5000'))
          ? '/api/auth/register'
          : 'http://localhost:5000/api/auth/register';

        const res = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password: pass })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('loopin_user', JSON.stringify(data.user));
        }
      } catch (err) {
        // Fallback mode offline
      }

      showToast('Pendaftaran berhasil! Akun LoopIn Anda siap digunakan. 🎉', 'success');
      setTimeout(() => {
        const redirectTo = new URLSearchParams(window.location.search).get('redirect') || 'tracking.html';
        window.location.href = redirectTo;
      }, 1200);
    }

    function socialLogin(provider) {
      showToast(`Menghubungkan akun dengan ${provider}...`, 'info');
      setTimeout(() => {
        const redirectTo = new URLSearchParams(window.location.search).get('redirect') || 'tracking.html';
        window.location.href = redirectTo;
      }, 1500);
    }

    function forgotPassword(e) {
      e.preventDefault();
      showToast('Instruksi pemulihan telah dikirim ke email Anda.', 'info');
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      let bgColor = 'bg-charcoal text-white';
      if (type === 'success') bgColor = 'bg-sage text-white';
      if (type === 'error') bgColor = 'bg-rose-700 text-white';
      if (type === 'info') bgColor = 'bg-amber text-white';

      toast.className = `${bgColor} px-4 py-3 rounded-2xl shadow-xl text-xs font-medium flex items-center justify-between gap-3 pointer-events-auto border border-white/20 mb-2 toast-slide`;
      toast.innerHTML = `
        <span>${message}</span>
        <button onclick="this.parentElement.remove()" class="opacity-70 hover:opacity-100">&times;</button>
      `;

      container.appendChild(toast);

      setTimeout(() => {
        if (toast.parentElement) {
          toast.remove();
        }
      }, 3500);
    }
  </script>
</body>
</html>
