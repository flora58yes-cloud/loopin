<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Produk — LoopIn</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/catalog.js"></script>

  <style>
    .icon-link.relative {
      position: relative !important;
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
    }

/* Toast Notification Styles */
    #toast-notification {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background-color: var(--deep-charcoal, #232822);
      color: var(--white, #FFFFFF);
      padding: 12px 20px;
      border-radius: 10px;
      font-family: var(--font-body, 'Inter'), sans-serif;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #toast-notification.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    #cart-badge {
      position: absolute !important;
      top: -6px !important;
      right: -8px !important;
      background-color: var(--amber-cheerful, #D4A373) !important;
      color: var(--white, #FFFFFF) !important;
      font-family: var(--font-body, 'Inter'), sans-serif !important;
      font-size: 10px !important;
      font-weight: 700 !important;
      min-width: 18px;
      height: 18px;
      border-radius: 9999px;
      display: flex !important;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      box-shadow: 0 2px 6px rgba(35, 40, 34, 0.15);
      line-height: 1;
      pointer-events: none;
      z-index: 10;
    }

    #cart-badge.hidden {
      display: none !important;
    }

    /* Thumbnail Gallery Styles */
    .thumbnail-scroll {
      display: flex;
      gap: 12px;
      margin-top: 14px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .thumb-img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
      border: 2px solid var(--neutral-taupe, #E5E0D8);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .thumb-img.active-thumb {
      border-color: var(--deep-charcoal, #232822);
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="main-header">
    <div class="container header-container">
      
      <div class="brand-group">
        <!-- Tombol Back dengan penanda from=detail -->
        <a href="index.html?from=detail" class="btn-header-back" aria-label="Kembali">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </a>

        <!-- Logo LoopIn dengan penanda from=detail -->
        <a href="index.html?from=detail" class="brand-logo">
          <img src="assets/images/branding/logo.png" alt="LoopIn Logo" class="header-logo-img">
          <span class="header-brand-text">LoopIn</span>
        </a>
      </div>

      <div class="search-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" placeholder="Cari pakaian, merek, atau kata kunci...">
      </div>

      <div class="header-actions">
        <a href="auth.html?role=seller" class="btn-sell">+ Jual Barang</a>
        <a href="cart.html" class="icon-link relative" aria-label="Keranjang">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span id="cart-badge" class="hidden">0</span>
        </a>
        <a href="auth.html" class="icon-link" aria-label="Akun Saya">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <!-- BREADCRUMB -->
  <div class="breadcrumb-nav">
    <div class="container path-links">
      <a href="index.html">Beranda</a> / <span id="breadcrumb-category">Katalog</span> / <span id="breadcrumb-title">Detail Produk</span>
    </div>
  </div>

  <!-- MAIN PRODUCT DETAIL -->
  <main class="product-detail-section">
    <div class="container product-detail-layout">
      
      <!-- GALLERY & THUMBNAILS -->
      <div class="product-gallery">
        <div class="main-image-box">
          <img id="main-product-img" src="" alt="Foto Produk Utama">
        </div>
        <div id="thumbnail-container" class="thumbnail-scroll"></div>
      </div>

      <!-- PRODUCT INFO -->
      <div class="product-info-box">
        <div class="seller-clean-meta">
          <span id="product-seller" class="seller-store">Store</span>
          <span class="dot-sep">&bull;</span>
          <span id="product-city">Kota</span>
        </div>

        <h1 id="product-title" class="product-detail-title">Nama Produk</h1>
        <div id="product-price" class="product-detail-price">Rp 0</div>

        <div class="spec-pills">
          <div class="pill">Ukuran: <span id="product-size">-</span></div>
          <div class="pill">Kondisi: <span id="product-condition">-</span></div>
        </div>

        <div class="divider"></div>

        <div class="product-description">
          <h3>Deskripsi Pakaian</h3>
          <p id="product-desc">Deskripsi produk akan dimuat di sini.</p>
        </div>

        <div class="action-group">
          <a href="chat.html" class="btn-chat-circle" aria-label="Chat Penjual">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
          </a>
          <button id="btn-add-cart" class="btn-add-cart">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            + Keranjang
          </button>
          <button id="btn-buy-now" class="btn-buy-now">Beli Sekarang</button>
        </div>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container footer-content">
      <p>&copy; 2026 LoopIn Platform. Give it another loop.</p>
    </div>
  </footer>

  <!-- Toast Notification Elemen -->
  <div id="toast-notification">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--amber-cheerful, #D4A373)" stroke-width="2.5">
      polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span id="toast-msg">Produk berhasil ditambahkan ke keranjang!</span>
  </div>

  <!-- SCRIPT RENDER DETAIL PRODUK -->
  <script>
    // Fungsi untuk menampilkan Toast Notification yang elegan
    function showToast(message) {
      const toast = document.getElementById('toast-notification');
      const msgSpan = document.getElementById('toast-msg');
      if (!toast) return;

      msgSpan.textContent = message;
      toast.classList.add('show');

      // Hilangkan otomatis setelah 2.5 detik
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    document.addEventListener("DOMContentLoaded", () => {
      updateCartBadge();

      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id') || '1';
      const product = productsData[productId];

      if (product) {
        document.getElementById('product-title').textContent = product.title;
        document.getElementById('breadcrumb-title').textContent = product.title;
        document.getElementById('product-price').textContent = product.priceFormatted;
        document.getElementById('product-size').textContent = product.size.toUpperCase();
        document.getElementById('product-condition').textContent = product.condition;
        document.getElementById('product-seller').textContent = product.seller;
        document.getElementById('product-city').textContent = product.city;
        document.getElementById('product-desc').textContent = product.desc;
        
        // ---> TAMBAHKAN / PASTIKAN BAGIAN INI ADA <---
        // Memaksa tombol chat membawa ID produk dan menyimpannya ke localStorage secara bersamaan
        const chatBtn = document.querySelector('.btn-chat-circle');
        if (chatBtn) {
          chatBtn.href = `chat.html?id=${productId}`;
          chatBtn.addEventListener('click', () => {
            const activeChatData = {
              name: product.title,
              price: product.priceFormatted,
              store: product.seller,
              img: product.images && product.images.length > 0 ? product.images[0] : (product.image || '')
            };
            localStorage.setItem('loopin_active_chat_product', JSON.stringify(activeChatData));
          });
        }
        // ---------------------------------------------

        if (product.category && product.category.length > 0) {
          document.getElementById('breadcrumb-category').textContent = product.category[0].charAt(0).toUpperCase() + product.category[0].slice(1);
        }

        const mainImg = document.getElementById('main-product-img');
        const thumbContainer = document.getElementById('thumbnail-container');
        
        let imageList = [];
        if (product.images && Array.isArray(product.images)) {
          imageList = product.images;
        } else if (product.image) {
          imageList = [product.image];
        }

        if (imageList.length > 0) {
          mainImg.src = imageList[0];

          if (imageList.length > 1) {
            imageList.forEach((imgSrc, index) => {
              const thumb = document.createElement('img');
              thumb.src = imgSrc;
              thumb.className = index === 0 ? "thumb-img active-thumb" : "thumb-img";
              
              thumb.addEventListener('click', () => {
                mainImg.src = imgSrc;
                document.querySelectorAll('.thumb-img').forEach(t => t.classList.remove('active-thumb'));
                thumb.classList.add('active-thumb');
              });

              thumbContainer.appendChild(thumb);
            });
          }
        }

        // Tombol Tambah ke Keranjang (Menggunakan Toast)
        const addCartBtn = document.getElementById('btn-add-cart');
        if (addCartBtn) {
          addCartBtn.addEventListener('click', () => {
            let cart = JSON.parse(localStorage.getItem('loopin_cart')) || [];
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
              existingItem.qty = (parseInt(existingItem.qty) || 1) + 1;
            } else {
              cart.push({
                id: productId,
                title: product.title,
                price: product.price,
                priceFormatted: product.priceFormatted,
                size: product.size,
                condition: product.condition,
                seller: product.seller,
                image: imageList[0] || '',
                qty: 1
              });
            }

            localStorage.setItem('loopin_cart', JSON.stringify(cart));
            updateCartBadge();
            showToast("Berhasil ditambahkan ke keranjang!");
          });
        }

        // Tombol Beli Sekarang
        const buyNowBtn = document.getElementById('btn-buy-now');
        if (buyNowBtn) {
          buyNowBtn.addEventListener('click', () => {
            let cart = JSON.parse(localStorage.getItem('loopin_cart')) || [];
            const existingItem = cart.find(item => item.id === productId);

            if (!existingItem) {
              cart.push({
                id: productId,
                title: product.title,
                price: product.price,
                priceFormatted: product.priceFormatted,
                size: product.size,
                condition: product.condition,
                seller: product.seller,
                image: imageList[0] || '',
                qty: 1
              });
              localStorage.setItem('loopin_cart', JSON.stringify(cart));
            }
            
            window.location.href = 'cart.html';
          });
        }
      } else {
        document.querySelector('.product-detail-layout').innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 60px;">
            <h3>Produk tidak ditemukan</h3>
            <p style="margin-top: 10px;"><a href="index.html?from=detail" style="color: var(--sage-ground);">Kembali ke Beranda</a></p>
          </div>
        `;
      }
    });
  </script>
